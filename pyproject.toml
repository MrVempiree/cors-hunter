[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cors-hunter"
version = "1.0.0"
description = "CORS misconfiguration scanner for authorised web security testing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Lavish Gangwar" }
]
keywords = ["cors", "security", "pentest", "scanner", "web-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
cors-hunter = "cors_hunter.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["cors_hunter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
